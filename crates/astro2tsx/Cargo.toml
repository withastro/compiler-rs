[package]
name                 = "astro2tsx"
version              = "0.1.0"
authors.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
rust-version.workspace = true
publish              = false
description          = "Converts .astro files to .tsx for tsserver intellisense, using Biome's HTML CST"

[lib]
crate-type = ["cdylib", "lib"]
test       = true
doctest    = false

[dependencies]
biome_html_parser = { git = "https://github.com/Princesseuh/biome", rev = "a7fc0b0ea54b7bca38e4a20c9bf30245a7732f01" }
biome_html_syntax = { git = "https://github.com/Princesseuh/biome", rev = "a7fc0b0ea54b7bca38e4a20c9bf30245a7732f01" }
biome_js_parser = { git = "https://github.com/Princesseuh/biome", rev = "a7fc0b0ea54b7bca38e4a20c9bf30245a7732f01" }
biome_js_syntax = { git = "https://github.com/Princesseuh/biome", rev = "a7fc0b0ea54b7bca38e4a20c9bf30245a7732f01" }
biome_languages = { git = "https://github.com/Princesseuh/biome", rev = "a7fc0b0ea54b7bca38e4a20c9bf30245a7732f01" }
biome_rowan = { git = "https://github.com/Princesseuh/biome", rev = "a7fc0b0ea54b7bca38e4a20c9bf30245a7732f01" }

napi        = { workspace = true }
napi-derive = { workspace = true }

[dev-dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = { workspace = true }
