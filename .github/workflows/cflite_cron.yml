name: ClusterFuzzLite cron tasks

# Daily corpus pruning (drops redundant corpus entries so batch fuzzing stays
# efficient) and a coverage report over the pruned corpus.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  Pruning:
    runs-on: ubuntu-latest
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune corpus
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: prune

  Coverage:
    runs-on: ubuntu-latest
    needs: Pruning
    steps:
      - name: Build fuzzers (coverage)
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: coverage

      - name: Generate coverage report
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: coverage
          sanitizer: coverage
